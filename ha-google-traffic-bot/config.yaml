name: "Google Maps Traffic Bot"
version: "1.3.1"
slug: "google_traffic_bot"
description: "Bot di monitoraggio traffico con Playwright, Telegram e integrazione nativa HA"
startup: application
boot: auto
homeassistant_api: true
arch:
  - amd64
  - aarch64
options:
  origin: "a"
  destination: "b"
  check_interval_minutes: 10
  diff_threshold_minutes: 5
  free_traffic_threshold_minutes: 35
  telegram_bot_token: "c"
  telegram_chat_id: "d"
schema:
  origin: str
  destination: str
  check_interval_minutes: int
  diff_threshold_minutes: int
  free_traffic_threshold_minutes: int
  telegram_bot_token: str
  telegram_chat_id: str
