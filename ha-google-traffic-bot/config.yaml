name: "Google Maps Traffic Bot"
version: "1.3.1"
slug: "google_traffic_bot"
description: "Bot di monitoraggio traffico con Playwright, Telegram e integrazione nativa HA"
startup: application
boot: auto
homeassistant_api: true
options:
  origin: ""
  destination: ""
  check_interval_minutes: 10
